# Example profile overrides for the three preview plugins.
#
# This is a profile-level patch layer, not a plugin bundle patch. A patch
# replaces the targeted row's whole `config`, so restate every key you want to
# keep; the defaults live in each plugin's own cordis.patch.yml.
#
# Put the rows you need in the profile's cordis.patch.yml (or the dsh-market
# config UI) and restart/refresh once.

- id: preview-media
  config:
    # 1 GiB is plenty for a single video and keeps memory bounded.
    maxBytes: 1073741824
    chunkBytes: 2097152

- id: preview-blender
  config:
    # Leave empty to auto-detect DSH_BLENDER / BLENDER_PATH / PATH.
    blenderPath: "C:\\Program Files\\Blender Foundation\\Blender 4.2\\blender.exe"
    timeoutMs: 300000

- id: preview-stl
  config:
    # STL is unitless; 10 reads the file as centimetres.
    unitScale: 10
    analysisMaxTriangles: 200000
