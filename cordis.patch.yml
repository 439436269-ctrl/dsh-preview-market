# dsh-preview-market bundle patch: one plugin row.
#
# A patch replaces the targeted row's whole `config`, so a profile that wants to
# override one key must restate the others it cares about. Every key below also
# has a code-side default in lib/config.js, so this file stays valid even when a
# patch-side helper is unavailable.
#
# `routeRoot` must stay under /api: the connection service authenticates every
# /api request (Host/Origin fence + browser session cookie) before the route
# runs, which is what keeps the installed-package inventory from being readable
# by a cross-site page.

- insert:
    - id: preview-market
      name: dsh-preview-market
      config:
        enabled: true
        routeRoot: /api/preview-market
        # Empty means "read profileContext from the Host", then
        # $DSH_HOME/profiles/desktop.
        profileDir: ""
        debug: false
